<!--
  Goatly — tuile d'icône « maskable » (Android).
  Le lanceur découpe l'icône selon sa propre forme : seul le disque central,
  soit 80 % du canevas, est garanti visible. La marque est donc réduite à 72 %
  et recentrée — sans quoi les pointes de cornes se font rogner.
-->
