<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Goatly — Suivi nutrition</title>
    <meta name="description" content="Suivi calories, macros et poids pour prise de muscle." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Deux variantes : Safari choisit selon le réglage Apparence de l'iPhone. -->
    <meta name="theme-color" content="#F7F8F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1011" media="(prefers-color-scheme: dark)" />

    <!-- iOS / Safari : "Ajouter à l'écran d'accueil" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Goatly" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- SVG d'abord : net à toute taille dans l'onglet. Le PNG sert de repli. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Polices variables Geist, préchargées pour éviter le flash de police système. -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
